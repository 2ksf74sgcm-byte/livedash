<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://ntfy.sh wss://public.cloud.shiftr.io; base-uri 'none'; form-action 'none'">
<title>Sol bots</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
:root{--bg:#121110;--s1:#1a1815;--s2:#221f1b;--s3:#2c2823;--ln:#2e2924;--ln2:#3e3830;--tx:#f3eee5;--tx2:#cbc3b4;--mut:#9a9182;--mut2:#6e665a;--gold:#f0bc4a;--gold2:#f9d68e;--goldA:rgba(240,188,74,.13);--goldB:rgba(240,188,74,.42);--pap:#8fb1e3;--papA:rgba(143,177,227,.13);--papG:rgba(143,177,227,.055);--up:#3dd68c;--upA:rgba(61,214,140,.13);--dn:#ff6e5e;--dnA:rgba(255,110,94,.13);--warn:#ff9f43;--focus:#a8c7ff;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.4,.64,1);color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Archivo,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,input,select{font:inherit;color:inherit}
a{color:var(--focus);text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.tn,table,.kv,.tile b,.hv b,.facts dd,.mono{font-variant-numeric:tabular-nums}

.mut{color:var(--mut)}.sm{font-size:12.5px}.up{color:var(--up)}.dn{color:var(--dn)}.gold-t{color:var(--gold2)}
.w{max-width:1240px;margin:0 auto;padding:0 20px 40px}
header.top{position:sticky;top:0;z-index:30;background:rgba(18,17,16,.84);-webkit-backdrop-filter:saturate(140%) blur(14px);backdrop-filter:saturate(140%) blur(14px);border-bottom:1px solid var(--ln)}
.bar{max-width:1240px;margin:0 auto;padding:10px 20px 0;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;font-stretch:108%;letter-spacing:-.01em;white-space:nowrap}

.tabs button:hover{color:var(--tx2)}.tabs button[aria-selected=true]{color:var(--tx)}

.card.paper{background-color:var(--s1);background-image:linear-gradient(var(--papG) 1px,transparent 1px),linear-gradient(90deg,var(--papG) 1px,transparent 1px);background-size:18px 18px;background-position:-1px -1px}

.chip .d{width:6px;height:6px;border-radius:50%;background:currentColor}

.unit{font-size:18px;font-weight:600;color:var(--gold);font-stretch:100%}

.chart{position:relative;margin-top:12px}
.chart canvas{display:block;width:100%;touch-action:pan-y;cursor:crosshair}
.c-hero{height:132px}
.n{border-radius:4px}.c-eq{height:178px}.c-cd{height:136px}
.ping{position:absolute;left:0;top:0;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;pointer-events:none;opacity:0}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin:14px 0 0;background:var(--ln);border-radius:12px;overflow:hidden;border:1px solid var(--ln)}
.facts>div{background:var(--s1);padding:9px 12px}

.pp{display:flex;flex-direction:column}
.pp .big{font-size:34px;font-weight:620;font-stretch:108%;letter-spacing:-.02em;line-height:1.05;margin-top:16px;color:var(--tx)}

.pnl{font-size:14.5px;font-weight:600;margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 12px}

.bl{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;font-size:11.5px;color:var(--mut);margin-top:6px}

.barw{max-width:100%}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--ln2);background:var(--s2);color:var(--tx);font-size:14px;font-weight:560;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,transform .12s,opacity .15s}
.btn:hover{background:var(--s3);text-decoration:none}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--tx);color:#15130f;border-color:var(--tx)}.btn.pri:hover{background:#fff}

.btn.gold{background:var(--gold);color:#1d1507;border-color:var(--gold)}

.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 16px,calc(100% - 12px) 16px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}

.note.warn{background:var(--dnA);color:#ffb3a8}
.tb{overflow:auto;background:var(--s1);border:1px solid var(--ln);border-radius:14px;-webkit-overflow-scrolling:touch}
.tb.tall{max-height:74vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px;white-space:nowrap;font-stretch:94%}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--ln)}
tbody tr:last-child td{border-bottom:0}
th{position:sticky;top:0;z-index:1;background:var(--s1);color:var(--mut);font-weight:520;font-size:12.5px;user-select:none}

td.l,th.l{text-align:left}

.side{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--s3);color:var(--tx2)}

.gauge{margin:12px 0 2px}

.cap{font-size:12px;color:var(--mut);margin-top:6px}

.empty-sm{color:var(--mut);font-size:13px;padding:22px 0 8px}
